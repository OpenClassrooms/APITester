name: Code Analysis

on:
    pull_request: ~
    push:
        branches:
            - main

jobs:
    code-validation:
        name: ${{ matrix.actions.name }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                actions:
                    -   name: Composer validate
                        run: composer validate --ansi --strict

                    -   name: PHPStan
                        run: composer phpstan

                    -   name: Ecs
                        run: composer check-cs

                    -   name: PHPUnit
                        run: composer unit
        steps:
            -   uses: actions/checkout@v5

            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.4
                    coverage: pcov
                    tools: composer:v2
                env:
                    COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            -   name: Install dependencies
                uses: "ramsey/composer-install@v2"


            -   run: ${{ matrix.actions.run }}

            -   name: Coverage diff
                uses: OpenClassrooms/coverage-checker@v1.7.0
                if: ${{ hashFiles('build/coverage/coverage.xml') != '' && github.event_name == 'pull_request' }}
                with:
                    action: check
                    files: '[{"coverage": "build/coverage/coverage.xml", "summary": "coverage-summary.json", "label": "Coverage", "badge": "coverage.svg"}]'
                    token: ${{ secrets.GITHUB_TOKEN }}

            -   name: Coverage update
                uses: OpenClassrooms/coverage-checker@v1.7.0
                if: ${{ hashFiles('build/coverage/coverage.xml') != '' && github.event_name == 'push' && github.ref_name == 'main' }}
                with:
                    action: update
                    files: '[{"coverage": "build/coverage/coverage.xml", "summary": "coverage-summary.json", "label": "Coverage", "badge": "coverage.svg"}]'
                    token: ${{ secrets.GITHUB_TOKEN }}

    runner-compatibility:
        name: Runners / PHPUnit ${{ matrix.phpunit }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - phpunit: '10.5'
                      paratest: '7.4'
                    - phpunit: '11.5'
                      paratest: '7.8'
        steps:
            - uses: actions/checkout@v5
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: pcov
                  tools: composer:v2
              env:
                  COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - name: Install compatible test runners
              run: >-
                  composer update --no-interaction --prefer-dist --no-progress
                  --with phpunit/phpunit:~${{ matrix.phpunit }}.0
                  --with brianium/paratest:~${{ matrix.paratest }}.0
            - name: Check static analysis with selected PHPUnit version
              run: composer phpstan
            - name: Test generated cases and process results
              run: >-
                  vendor/bin/phpunit --no-configuration --bootstrap vendor/autoload.php
                  --fail-on-phpunit-deprecation tests/Runner
            - name: Run full unit suite
              run: composer unit

    dependency-compatibility:
        name: Symfony ${{ matrix.symfony }} / Carbon ${{ matrix.carbon }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - symfony: '6.4'
                      carbon: '2'
                    - symfony: '6.4'
                      carbon: '3'
                    - symfony: '7.4'
                      carbon: '3'
        steps:
            - uses: actions/checkout@v5
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: pcov
                  tools: composer:v2
              env:
                  COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - name: Select dependency combination
              env:
                  SYMFONY_VERSION: ${{ matrix.symfony }}
                  CARBON_VERSION: ${{ matrix.carbon }}
              run: |
                  php <<'PHP'
                  <?php
                  $path = 'composer.json';
                  $composer = json_decode(file_get_contents($path), true, 512, JSON_THROW_ON_ERROR);
                  foreach (['require', 'require-dev'] as $section) {
                      foreach ($composer[$section] as $package => $constraint) {
                          if (str_starts_with($package, 'symfony/')) {
                              $composer[$section][$package] = '^' . getenv('SYMFONY_VERSION');
                          }
                      }
                  }
                  $composer['require']['nesbot/carbon'] = '^' . getenv('CARBON_VERSION');
                  file_put_contents($path, json_encode($composer, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));
                  PHP
                  composer update --no-interaction --prefer-dist --no-progress
            - run: composer phpstan
            - run: composer unit
